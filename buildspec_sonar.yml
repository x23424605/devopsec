version: 0.2
env:
  secrets-manager:
    LOGIN: venkadesh_sonar:LOGIN
    HOST: venkadesh_sonar:HOST
    Organization: venkadesh_sonar:Organization
    Project: venkadesh_sonar:Project  # SonarCloud Project Key
phases:
  install:
    runtime-versions:
      python: 3.11
      java: corretto17
    commands:
      - yum update -y
      - yum install -y jq unzip
      - python -m venv venv
      - source venv/bin/activate
      - pip install --upgrade pip
      - pip install -r requirements.txt
      # Download and set up SonarScanner
      - wget https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-5.0.1.3006-linux.zip
      - unzip sonar-scanner-cli-5.0.1.3006-linux.zip
      - chmod +x sonar-scanner-5.0.1.3006-linux/bin/*
      - export PATH=$PATH:$PWD/sonar-scanner-5.0.1.3006-linux/bin
  pre_build:
    commands:
      - python --version
      - java -version
      - sonar-scanner --version  # Make sure sonar-scanner is available
  build:
    commands:
      - echo "Running SonarCloud analysis..."
      - sonar-scanner -Dsonar.projectKey=$Project -Dsonar.organization=$Organization -Dsonar.host.url=$HOST  # Run the SonarCloud scan
      - echo "Waiting for SonarCloud automatic analysis to complete..."
      - sleep 10  # Adjust based on expected time for analysis completion
      - echo "Checking Quality Gate status..."
      # Make sure $LOGIN, $HOST, and $Project are defined and valid
      - curl -u "$LOGIN:" "$HOST/api/qualitygates/project_status?projectKey=$Project" > result.json
      - cat result.json
      # Check if the Quality Gate passed
      - |
        if [ "$(jq -r '.projectStatus.status' result.json)" = "ERROR" ]; then
          echo "❌ Quality Gate failed"
          exit 1
        else
          echo "✅ Quality Gate passed"
        fi
artifacts:
  files:
    - '**/*'
