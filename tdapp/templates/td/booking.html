{% extends "base.html" %}
{% load static %}
 
{% block content %}
 
<style>
    .booking-form {
        margin-top: 150; /* Moves the form to the top */
        padding: 20px;
        border: 1px solid #ddd;
        border-radius: 8px;
        max-width: 400px;
        box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.1);
        width: 100%;
        margin-left: auto;
        margin-right: auto;
        position: relative;
        margin-top: -70px;
    }
    
    .booking-form label {
        display: block;
        margin: 5px 0 5px;
    }
 
    .booking-form input, .booking-form select {
        width: 100%;
        padding: 5px;
        margin-bottom: 8px;
        border: 1px solid #ccc;
        border-radius: 4px;
    }
 
    .booking-form button {
        background-color: #28a745;
        color: white;
        padding: 10px;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        width: 100%;
    }
 
    .booking-form button:hover {
        background-color: #218838;
    }
 
    /* Back Button Styling */
    .back-button {
        margin-top: 10px;
        padding: 10px 20px;
        background-color: #007bff;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        width: 100%;
    }
 
    .back-button:hover {
        background-color: #0056b3;
    }
 
</style>
<h2>Book Your Destination {{ country }}</h2>
<h3 style="margin-top: 25px;">Destination: {{country}}</h3>
<!-- Booking Form -->
<form method="post" class="booking-form">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Submit</button><br><br>
    <button type="button" onclick="document.location.href='/dashboard'" class="back-button">Back</button>
</form>
 
<!-- JavaScript to Set Min Date -->
<script>
    window.onload = function() {

        var today = new Date().toISOString().split('T')[0];
 
        var checkInField = document.querySelector('input[name="check_in"]');
        var checkOutField = document.querySelector('input[name="check_out"]');
 
        checkInField.setAttribute('min', today);
        checkOutField.setAttribute('min', today);
    };
</script>
 
{% endblock %}
