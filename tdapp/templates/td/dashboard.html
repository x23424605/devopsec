{% extends "base.html" %}
{% block content %}

<style>
    h1 {
        text-align: center;
    }

    body {
        padding-top: 70px; 
    }

    .logout-btn {
        position: absolute;
        top: 10px; 
        right: 20px;
        z-index: 1001; 
    }

    body {
            font-family: Arial, sans-serif;
        }
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 20px;
            border-bottom: 1px solid #ccc;
        }
        .logo {
            display: flex;
            align-items: center;
        }
        .logo img {
            height: 30px;
            margin-right: 10px;
        }
        .nav {
            display: flex;
            align-items: center;
        }
        .nav a {
            margin: 0 10px;
            text-decoration: none;
            color: #333;
        }
        .nav a.active {
            color: red;
        }
        .social-icons {
            display: flex;
            align-items: center;
        }
        .social-icons img {
            height: 20px;
            margin: 0 5px;
        }
</style>


<p id="welcomeMessage" style="display: none;">🎉 Welcome, {{ user.username }}! Have a great time.</p> 

<div class="header">
    <div class="logo">
        <h1>Where Would <span style="color: red;">You</span> <span style="color: green;">Go</span></h1>
    </div>
    <div class="nav">
        <a href="#" class="active">Destinations</a>
        <a href="#">My Plans</a>
    </div>

    <a href="{% url 'logout' %}" class="btn btn-danger logout-btn">Logout</a>

</div>
<script>
    window.onload = function () {
        var welcomeMessage = document.getElementById('welcomeMessage');

        // Check if the message has already been displayed in this session
        if (!sessionStorage.getItem("welcomeDisplayed")) {
            if (welcomeMessage) {
                welcomeMessage.style.display = 'block'; 
                setTimeout(function () {
                    welcomeMessage.style.display = 'none'; 
                }, 10000);
            }

            // session storage flag so first time it show message and then it won't show again
            sessionStorage.setItem("welcomeDisplayed", "true");
        }
    };
</script>




{% endblock %}
