{% extends "base.html" %}

{% block content %}
<h2>Delete Booking</h2>
<p>Are you sure you want to delete the booking for <strong>{{ booking.name }}</strong> from <strong>{{ booking.check_in }}</strong> to <strong>{{ booking.check_out }}</strong>?</p>

<form method="POST">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Delete</button>
    <a href="{% url 'my_plans' %}" class="btn btn-secondary">Cancel</a>
</form>

{% endblock %}
