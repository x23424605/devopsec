{% extends "base.html" %}

{% block content %}
{% load static %}

{% include "td/dashboard.html" %}

<style>
    .container {
        display: flex;
        gap: 15px;
    }
    .card {
        position: relative;
        width: 300px;
        height: 200px;
        color: white;
        font-family: Arial, sans-serif;
        border-radius: 10px;
        overflow: hidden;
    }
    .card img {
        width: 100%;
        height: 100%;
        object-fit: cover;
    }
    .overlay {
        position: absolute;
        bottom: 0;
        left: 0;
        width: 100%;
        padding: 10px;
        background: rgba(0, 0, 0, 0.5);
    }
    .tag {
        background-color: #4CAF50;
        color: white;
        padding: 5px 10px;
        border-radius: 15px;
        font-size: 12px;
        font-weight: bold;
        display: inline-block;
        margin-bottom: 5px;
    }
    .title {
        font-size: 16px;
        font-weight: bold;
    }
</style>

<div class="container">
    <div class="card">
        <img src="{% static 'images/venice.jpg' %}" alt="Venice, Itlay">
        <div class="overlay">
            <div class="tag">EUROPE</div>
            <div class="title">Where boats replace cars, Venice</div>
        </div>
    </div>

    <div class="card">
        <img src="{% static 'images/dubai.jpg' %}" alt="Dubai">
        <div class="overlay">
            <div class="tag">Middle East</div>
            <div class="title">Glittering nights and luxe days, Dubai</div>
        </div>
    </div>

    <div class="card">
        <img src="{% static 'images/singapore_.jpg' %}" alt="Singapore">
        <div class="overlay">
            <div class="tag">ASIA</div>
            <div class="title">The Best of Singapore</div>
        </div>
    </div>

</div>

{% endblock %}
